name: Android APK and AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'android/**'
      - 'packages/**'
      - 'pubspec.*'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Test imports and VPN configuration
        run: flutter test
      - name: Validate generated configs with sing-box 1.13.13
        run: |
          dart tool/config_fixtures.dart
          curl -fsSL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.13.13/sing-box-1.13.13-linux-amd64.tar.gz -o /tmp/sing-box.tar.gz
          echo 'bb99cabf47694625db421ee17898f36cdc1f9c2cb5decf65b12bac8d8437e842  /tmp/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/android.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/generic.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/xray.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/xray-grpc.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/xhttp-bridge.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/auto-bridge.json
      - name: Prepare pinned sing-box source
        run: bash scripts/prepare_core.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: build/sing-box/go.sum
      - name: Test REALITY and HTTPS against Xray 26.9.9
        run: bash scripts/test_reality.sh
      - name: Validate XHTTP Xray config
        run: |
          build/reality-test/xray run -test -config build/config-check/xhttp-xray.json
          build/reality-test/xray run -test -config build/config-check/hysteria-xray.json
          build/reality-test/xray run -test -config build/config-check/auto-xray.json
          build/reality-test/xray run -test -config build/config-check/tcp-tls-xray.json
          build/reality-test/xray run -test -config build/config-check/xhttp-tls-xray.json
      - name: Test proxy GET through sing-box outbound
        run: (cd build/sing-box && go test -tags with_utls -run TestBMrayProbeProxyGET ./experimental/libbox)
      - uses: actions/cache@v4
        id: libbox-cache
        with:
          path: |
            packages/vpn_plugin/android/libs/libbox.aar
            packages/vpn_plugin/android/libs/libbox.aar.sha256
          key: libbox-android-go1.25.10-ndk28-${{ hashFiles('patches/**', 'scripts/prepare_core.sh', 'scripts/build_libbox_android.sh') }}
      - uses: android-actions/setup-android@v3
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android NDK
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: sdkmanager 'ndk;28.0.13004108' 'platforms;android-36'
      - name: Build patched Android core
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox_android.sh
      - name: Restore permanent Android signing key
        if: github.event_name != 'pull_request'
        env:
          BMRAY_KEYSTORE_BASE64: ${{ secrets.BMRAY_KEYSTORE_BASE64 }}
          BMRAY_KEY_ALIAS: ${{ secrets.BMRAY_KEY_ALIAS }}
          BMRAY_KEYSTORE_PASSWORD: ${{ secrets.BMRAY_KEYSTORE_PASSWORD }}
          BMRAY_KEY_PASSWORD: ${{ secrets.BMRAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BMRAY_KEYSTORE_BASE64 BMRAY_KEY_ALIAS BMRAY_KEYSTORE_PASSWORD BMRAY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/bmray-release.jks"
          printf '%s' "$BMRAY_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          echo "BMRAY_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        if: github.event_name != 'pull_request'
        env:
          BMRAY_KEY_ALIAS: ${{ secrets.BMRAY_KEY_ALIAS }}
          BMRAY_KEYSTORE_PASSWORD: ${{ secrets.BMRAY_KEYSTORE_PASSWORD }}
          BMRAY_KEY_PASSWORD: ${{ secrets.BMRAY_KEY_PASSWORD }}
        run: bash scripts/build_android.sh
      - name: Compile pull request with an unpublished test key
        if: github.event_name == 'pull_request'
        run: bash scripts/build_android_test.sh
      - name: Upload release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BMray-android-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BMray-android-${{ github.run_number }}
          path: release-artifact
      - name: Publish signed build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([0-9][0-9.]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)"
          if [[ -z "$version" ]]; then
            echo 'Invalid pubspec version' >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; version bump required for a new release."
            exit 0
          fi
          apk="release-artifact/flutter-apk/app-release.apk"
          aab="release-artifact/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          mkdir -p release-assets
          cp "$apk" "release-assets/BMray-$version-android.apk"
          cp "$aab" "release-assets/BMray-$version-android.aab"
          sha256sum release-assets/*
          notes="release-notes/$tag.md"
          if [[ -f "$notes" ]]; then
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
              --title "BMray $version" --notes-file "$notes"
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
              --title "BMray $version" --generate-notes
          fi
