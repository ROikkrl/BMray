name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'android/**'
      - 'packages/**'
      - 'pubspec.*'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Test imports and VPN configuration
        run: flutter test
      - name: Validate generated configs with sing-box 1.13.13
        run: |
          dart tool/config_fixtures.dart
          curl -fsSL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.13.13/sing-box-1.13.13-linux-amd64.tar.gz -o /tmp/sing-box.tar.gz
          echo 'bb99cabf47694625db421ee17898f36cdc1f9c2cb5decf65b12bac8d8437e842  /tmp/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/android.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/generic.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/xray.json
          /tmp/sing-box-1.13.13-linux-amd64/sing-box check -c build/config-check/xray-grpc.json
      - name: Prepare pinned sing-box source
        run: bash scripts/prepare_core.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: build/sing-box/go.sum
      - name: Test REALITY and HTTPS against Xray 26.9.9
        run: bash scripts/test_reality.sh
      - name: Test proxy GET through sing-box outbound
        run: (cd build/sing-box && go test -tags with_utls -run TestBMrayProbeProxyGET ./experimental/libbox)
      - uses: actions/cache@v4
        id: libbox-cache
        with:
          path: |
            packages/vpn_plugin/android/libs/libbox.aar
            packages/vpn_plugin/android/libs/libbox.aar.sha256
          key: libbox-android-go1.25.10-ndk28-${{ hashFiles('patches/**', 'scripts/prepare_core.sh', 'scripts/build_libbox_android.sh') }}
      - uses: android-actions/setup-android@v3
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android NDK
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: sdkmanager 'ndk;28.0.13004108' 'platforms;android-36'
      - name: Build patched Android core
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox_android.sh
      - name: Build test-signed APK and AAB
        run: bash scripts/build_android_test.sh
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: BMray-android-test-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
